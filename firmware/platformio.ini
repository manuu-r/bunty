[platformio]
default_envs = bunty

[env:bunty]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200
board_build.partitions = default_8MB.csv
; The N8R8 module carries 8 MB of octal-interface PSRAM. Voice needs it: the
; capture and playback rings plus the TLS session do not fit alongside the
; display framebuffer in internal SRAM.
board_build.arduino.memory_type = qio_opi
extra_scripts =
    pre:scripts/provision_iot_gateway.py
    post:scripts/vad_build.py
build_unflags =
    -fexceptions
    -std=gnu99
build_flags =
    ; Bunty's USB connector reaches UART0 through a CH343 bridge. Keeping
    ; Serial on UART0 makes application diagnostics appear beside ESP-IDF
    ; Wi-Fi logs in `pio device monitor`; native USB CDC is not wired here.
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D BOARD_HAS_PSRAM
    ; Temporary: lets esp-tls and the websocket client report why a
    ; handshake failed. Drop back to 0 once voice is known good.
    -D CORE_DEBUG_LEVEL=3
    -fno-exceptions
    -Wl,--wrap=helix_malloc
    -Wl,--wrap=helix_free
    -Wl,--wrap=malloc
    -Wl,--wrap=calloc
    -Wall
    -Wextra
    -Wno-unused-parameter
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    ; Portable WebRTC VAD; fixed revision, no neural model/SDK migration.
    https://github.com/dpirch/libfvad.git#532ab666c20d3cfda38bca63abbb0f152706c369
    ; Helix MP3 decoder, for the boot greeting and the voice gateway's spoken
    ; replies. Pinned to a tag; the sources land in the ignored .pio directory
    ; rather than being vendored here.
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit BusIO@^1.16.2

; Explicit build for modules without PSRAM. The UI becomes monochrome and
; cloud voice is unavailable; pins, pairing, taps and servo behavior persist.
[env:bunty-no-psram]
extends = env:bunty
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${env:bunty.build_flags}
    -UBOARD_HAS_PSRAM

; Same firmware, retargeted to the Waveshare ESP32-S3-Touch-LCD-2 board. It
; carries the same ESP32-S3R8 module and octal PSRAM, so voice, UI, pairing and
; dashboards are unchanged. The display wiring differs, and the amplifier LRC
; moves from GPIO5 (not broken out) to GPIO18; see Config.h,
; BUNTY_BOARD_WAVESHARE. Every other servo, amplifier and microphone pin
; matches the carrier board.
; Serial runs over the native USB port here.
[env:bunty-waveshare]
extends = env:bunty
; This board's USB-C port is the ESP32-S3 native USB, not a UART bridge, so
; Serial has to be the on-chip CDC.
build_unflags =
    ${env:bunty.build_unflags}
    -D ARDUINO_USB_CDC_ON_BOOT=0
build_flags =
    ${env:bunty.build_flags}
    -D BUNTY_BOARD_WAVESHARE
    -D ARDUINO_USB_CDC_ON_BOOT=1
