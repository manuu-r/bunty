[platformio]
default_envs = bunty

[env:bunty]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200
board_build.partitions = default_8MB.csv
; The N8R8 module carries 8 MB of octal-interface PSRAM; the display
; framebuffer, dashboard JSON, and voice capture/playback rings live there.
board_build.arduino.memory_type = qio_opi
; BUNTY_PROVISION_IOT=1 on an upload stages a fresh IoT gateway token.
extra_scripts =
    pre:scripts/provision_iot_gateway.py
build_unflags =
    -fexceptions
    -std=gnu99
build_flags =
    ; The USB-C port is the ESP32-S3's native USB, not a UART bridge.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -fno-exceptions
    -Wl,--wrap=malloc
    -Wl,--wrap=calloc
    -Wall
    -Wextra
    -Wno-unused-parameter
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit BusIO@^1.16.2

